name: Build and publish Klavar

# Runs on every push to main (and on demand). Builds the Android app, then publishes
# a release containing the APK, the web bundle for over-the-air updates, and
# version.json, which installed apps check to find updates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Work out version numbers
        run: |
          echo "WEB_BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "NATIVE_BUILD=$(tr -dc '0-9' < native-version.txt)" >> "$GITHUB_ENV"

      - name: Stamp the build number and update address into the app
        run: |
          FEED="https://github.com/${RELEASE_REPO}/releases/latest/download/version.json"
          echo "window.KLAVAR_BUILD = { web: ${WEB_BUILD}, native: ${NATIVE_BUILD}, feed: '${FEED}' };" > www/build-info.js

      - run: npm ci
      - run: npx cap sync android

      - name: Use the permanent signing key
        env:
          KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE secret is not set. Each build gets a different key, so updates will not install over each other."
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEY" | base64 -d > ~/.android/debug.keystore

      - name: Build the APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug -PversionCode=${NATIVE_BUILD} -PversionName=1.${NATIVE_BUILD}.${WEB_BUILD}

      - name: Package the release files
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/klavar.apk
          (cd www && zip -qr ../dist/web-bundle.zip .)
          BASE="https://github.com/${RELEASE_REPO}/releases/download/build-${WEB_BUILD}"
          printf '{"web": %s, "native": %s, "bundle": "%s/web-bundle.zip", "apk": "%s/klavar.apk"}\n' \
            "$WEB_BUILD" "$NATIVE_BUILD" "$BASE" "$BASE" > dist/version.json
          cat dist/version.json

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASE_REPO }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          tag_name: build-${{ github.run_number }}
          name: Klavar build ${{ github.run_number }}
          make_latest: true
          files: dist/*
